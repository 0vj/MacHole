name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -v ./...

      - name: Test CGO-free CLI build
        run: CGO_ENABLED=0 go build -v -o machole-cli ./cmd/machole

      - name: Build macOS Universal App Bundle
        run: |
          chmod +x build.sh
          ./build.sh
